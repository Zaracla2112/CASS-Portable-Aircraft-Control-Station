
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>html,body,#map{height:100%;margin:0;}</style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map').setView([32.5, -115.5], 9);
    L.tileLayer('http://localhost:8765/{z}/{x}/{y}.png', {
        minZoom: 8,
        maxZoom: 14,
        tileSize: 256,
        attribution: 'OSM local'
    }).addTo(map);
  </script>
</body>
</html>
